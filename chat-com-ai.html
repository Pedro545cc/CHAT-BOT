<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat com AI</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #4a90e2;
    color: white;
    padding: 1rem;
    text-align: center;
    font-size: 1.5rem;
  }
  #chat-container {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
    background: white;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .message {
    max-width: 70%;
    padding: 0.75rem 1rem;
    border-radius: 15px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .user-message {
    background-color: #dcf8c6;
    align-self: flex-end;
  }
  .ai-message {
    background-color: #ececec;
    align-self: flex-start;
  }
  footer {
    padding: 1rem;
    background: #ddd;
    display: flex;
    gap: 0.5rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 20px;
  }
  button {
    background: #4a90e2;
    color: white;
    border: none;
    padding: 0 1.5rem;
    font-size: 1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  button:disabled {
    background: #a0bde9;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background: #357abd;
  }
</style>
</head>
<body>
<header>Chat AI</header>
<div id="chat-container" aria-live="polite" aria-label="Chat history"></div>
<footer>
  <input type="text" id="user-input" placeholder="Digite sua mensagem..." aria-label="Digite sua mensagem" />
  <button id="send-button" disabled>Enviar</button>
</footer>
<script>
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendButton = document.getElementById('send-button');

  // Enable send button only when input is not empty
  userInput.addEventListener('input', () => {
    sendButton.disabled = userInput.value.trim() === '';
  });

  function appendMessage(text, className) {
    const messageDiv = document.createElement('div');
    messageDiv.textContent = text;
    messageDiv.className = 'message ' + className;
    chatContainer.appendChild(messageDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function simulateAIResponse(userText) {
    // Simple example of AI response logic
    const lowerText = userText.toLowerCase();
    let response = "Desculpe, não entendi. Pode reformular?";
    if (lowerText.includes('olá') || lowerText.includes('oi')) {
      response = "Olá! Como posso ajudar você hoje?";
    } else if (lowerText.includes('hora')) {
      response = "Agora são " + new Date().toLocaleTimeString() + ".";
    } else if (lowerText.includes('tchau') || lowerText.includes('adeus')) {
      response = "Até logo! Volte sempre.";
    } else if (lowerText.includes('como você está')) {
      response = "Estou muito bem, obrigado por perguntar!";
    }
    return response;
  }

  function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    appendMessage(text, 'user-message');
    userInput.value = '';
    sendButton.disabled = true;

    // Simulate AI response with a slight delay
    setTimeout(() => {
      const aiResponse = simulateAIResponse(text);
      appendMessage(aiResponse, 'ai-message');
    }, 800);
  }
